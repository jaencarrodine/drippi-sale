<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drippi has shut down</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/drippi-icon.svg" type="image/svg+xml">
<meta http-equiv="refresh" content="4; url=/">
<style>
  :root {
    --bg: #16151F;
    --ink: #F4F3FF;
    --muted: #A5A1B8;
    --grad-a: #741CE4;
    --grad-b: #4C00C9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  main { max-width: 480px; }
  .mark { width: 56px; height: 56px; display: block; margin-bottom: 28px; }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  p { color: var(--muted); }
  a {
    color: var(--ink);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 2px solid var(--grad-a);
    padding-bottom: 1px;
  }
  a:focus-visible { outline: 2px solid var(--grad-a); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/drippi-icon.svg" alt="Drippi logo" width="56" height="56">
  <h1>This page went with the product.</h1>
  <p>Drippi has shut down, and its assets are for sale. Taking you to the details — or <a href="/">go there now</a>.</p>
</main>
</body>
</html>
